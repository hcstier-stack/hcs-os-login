<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Leitstand</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1e21;--mut:#5f6670;--acc:#0a66d6;--ok:#1b7f3b;--no:#b3261e;--rand:#d5d9e0;--hl:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1f24;--fg:#eceef2;--mut:#9aa1ac;--acc:#4c9bff;--ok:#43b866;--no:#ff6b61;--rand:#33363d;--hl:#4a3f12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:12px 16px 60px;max-width:720px;margin:auto}
h1{font-size:22px;margin:8px 0 12px}h2{font-size:18px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--rand);border-radius:14px;padding:14px;margin:12px 0}
.card.hl{background:var(--hl)}.meta{color:var(--mut);font-size:14px}
.frage{border-top:1px solid var(--rand);padding-top:10px;margin-top:10px}
.emp{color:var(--mut);font-size:14px;margin:4px 0}
button,select,textarea,input{font:inherit;color:var(--fg)}
button{min-height:56px;padding:0 18px;border-radius:12px;border:1px solid var(--rand);background:var(--card);margin:4px 6px 4px 0;cursor:pointer}
button.gross{width:100%;background:var(--acc);color:#fff;border:0;font-weight:600}
button.ja.sel{background:var(--ok);color:#fff}button.nein.sel{background:var(--no);color:#fff}button.empf.sel{background:var(--acc);color:#fff}
textarea,select,input[type=text],input[type=email]{width:100%;min-height:56px;padding:10px;border-radius:12px;border:1px solid var(--rand);background:var(--bg);margin:4px 0}
textarea{min-height:90px}label{display:block;margin-top:10px;color:var(--mut);font-size:14px}
#msg{position:sticky;top:0;background:var(--card);border:1px solid var(--rand);border-radius:12px;padding:10px;margin:8px 0;display:none}
[hidden]{display:none!important}
</style></head><body>
<h1>Leitstand</h1>
<div id="msg"></div>
<div id="anmeldung" class="card" hidden>
<div id="schritt1"><label>E-Mail</label><input type="email" id="mail" autocomplete="email" autocapitalize="off">
<button class="gross" id="codeAnfordern">Code anfordern</button></div>
<div id="schritt2" hidden><label>Code aus der E-Mail</label><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code">
<button class="gross" id="codePruefen">Anmelden</button></div>
</div>
<div id="innen" hidden>
<button class="gross" id="alle">Alle Empfehlungen annehmen</button>
<div id="offen"></div>
<h2>Sitzung starten</h2>
<div class="card">
<label>Projekt</label><select id="projekt"></select>
<label>Thread (optional: Chat-ID eines Anschlusschats)</label><input type="text" id="chatid" autocapitalize="off" autocorrect="off">
<label>Umgebung</label><select id="umgebung"></select>
<label>Modell</label><select id="modell"><option>sonnet</option><option>haiku</option><option>opus</option></select>
<label>Kurzname</label><input type="text" id="kurzname" autocapitalize="off" autocorrect="off">
<label>Auftrag</label><textarea id="auftrag"></textarea>
<button class="gross" id="starten">Starten</button>
</div>
<p class="meta"><span id="lage"></span> <button id="abmelden">Abmelden</button></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
const CFG={funktion:"https://oadywakxleonlxbhepkj.supabase.co/functions/v1/antwort-zentrale",url:"https://oadywakxleonlxbhepkj.supabase.co",anon:"sb_publishable_8Q-0R6651FVpsXrnH0tTgA_ufwARRlE"};
const P=new URLSearchParams(location.search),F=P.get('f')||'';
const sb=window.supabase.createClient(CFG.url,CFG.anon,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'az-leitstand'}});
const $=function(id){return document.getElementById(id)};
function meld(t){const m=$('msg');m.textContent=t;m.style.display='block';window.scrollTo(0,0)}
async function api(pfad,body){
 const s=(await sb.auth.getSession()).data.session;
 if(!s){zeigeAnmeldung();return {ok:false,grund:'nicht angemeldet'}}
 const o={headers:{Authorization:'Bearer '+s.access_token,apikey:CFG.anon}};
 if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
 try{const r=await fetch(CFG.funktion+pfad,o);if(r.status===401){zeigeAnmeldung();return {ok:false,grund:'nicht angemeldet'}}return await r.json()}
 catch(e){return {ok:false,grund:String(e)}}}
function h(tag,props,kids){const e=document.createElement(tag);Object.assign(e,props||{});(kids||[]).forEach(function(k){e.append(k)});return e}
function zeigeAnmeldung(){$('anmeldung').hidden=false;$('innen').hidden=true}
let karten=[];
async function lade(){
 const r=await api('/api/offen');const box=$('offen');box.textContent='';karten=[];
 if(!r.ok){if(r.grund!=='nicht angemeldet')meld('Fehler: '+(r.grund||'?'));return}
 if(!r.fragen.length)box.append(h('p',{className:'meta',textContent:'Keine offenen Fragen.'}));
 r.fragen.forEach(function(f){
  const wahl={},texte={};
  const card=h('div',{className:'card'+(f.frage_id===F?' hl':'')});
  card.append(h('div',{className:'meta',textContent:[f.chat_id||f.session_id,f.projekt,f.gestellt_am].filter(Boolean).join(' · ')}));
  if(f.sprechtext)card.append(h('div',{textContent:f.sprechtext}));
  f.fragen.forEach(function(q){
   const bl=h('div',{className:'frage'});
   bl.append(h('div',{textContent:q.nr+'. '+q.text}));
   if(q.empfehlung)bl.append(h('div',{className:'emp',textContent:'Empfehlung: '+(q.empfehlung==='ja'?'Ja':'Nein')}));
   const knoepfe={};
   const mk=function(art,txt){const b=h('button',{className:art,textContent:txt});b.onclick=function(){wahl[q.nr]=(wahl[q.nr]===art)?null:art;
     Object.keys(knoepfe).forEach(function(k){knoepfe[k].classList.toggle('sel',wahl[q.nr]===k)})};knoepfe[art]=b;bl.append(b)};
   mk('ja','Ja');mk('nein','Nein');if(q.empfehlung)mk('empf','Empfehlung annehmen');
   const t=h('textarea',{placeholder:'Text oder Diktat'});t.oninput=function(){texte[q.nr]=t.value};bl.append(t);card.append(bl)});
  const s=h('button',{className:'gross',textContent:'Senden'});
  s.onclick=async function(){const liste=[];
   f.fragen.forEach(function(q){const w=wahl[q.nr],t=(texte[q.nr]||'').trim();
    if(w==='ja'||w==='nein')liste.push({nr:q.nr,wahl:w,text:t});
    else if(w==='empf')liste.push({nr:q.nr,wahl:'empfehlung',text:''});
    else if(t)liste.push({nr:q.nr,wahl:'text',text:t})});
   if(!liste.length){meld('Nichts gewaehlt oder eingegeben.');return}
   const r2=await api('/api/antwort',{frage_id:f.frage_id,antworten:liste});
   meld(r2.ok?'Gesendet. Der Mac holt die Antwort in wenigen Sekunden ab.':'Fehler: '+(r2.grund||'?'));lade()};
  card.append(s);box.append(card);karten.push(f)})}
$('alle').onclick=async function(){
 if(!karten.length){meld('Keine offenen Fragen.');return}
 const res=[];for(const f of karten){const r=await api('/api/antwort',{frage_id:f.frage_id,alle_empfehlungen:true});res.push(f.frage_id+': '+(r.ok?'ok':(r.grund||'Fehler')))}
 meld(res.join(' | '));lade()};
async function ladeStart(){
 const p=await api('/api/projekte'),u=await api('/api/umgebungen');
 const sp=$('projekt');sp.textContent='';(p.projekte||[]).forEach(function(n){sp.append(h('option',{value:n,textContent:n}))});
 const su=$('umgebung');su.textContent='';(u.umgebungen||[]).forEach(function(e){su.append(h('option',{value:e.id,disabled:!e.startbar,textContent:e.name+(e.startbar?'':' (nicht startbar: '+(e.grund||'')+')')}))});
 const l=await api('/api/lage');if(l.ok&&l.lage)$('lage').textContent='Mac zuletzt gesehen: '+(l.lage.mac_zuletzt_gesehen||'noch nie')+' · offen '+l.lage.offen}
$('starten').onclick=async function(){
 const b={projekt:$('projekt').value,chatid:$('chatid').value.trim(),umgebung:$('umgebung').value,modell:$('modell').value,kurzname:$('kurzname').value.trim(),auftrag:$('auftrag').value};
 const r=await api('/api/start',b);meld(r.ok?'Uebergeben. Der Mac startet die Sitzung in wenigen Sekunden.':'Nicht gestartet: '+(r.grund||'?'))};
$('codeAnfordern').onclick=async function(){
 const mail=$('mail').value.trim();if(!mail){meld('E-Mail fehlt.');return}
 const r=await sb.auth.signInWithOtp({email:mail,options:{shouldCreateUser:false}});
 if(r.error){meld('Code nicht gesendet: '+r.error.message);return}
 $('schritt1').hidden=true;$('schritt2').hidden=false;meld('Code ist unterwegs.')};
$('codePruefen').onclick=async function(){
 const r=await sb.auth.verifyOtp({email:$('mail').value.trim(),token:$('code').value.trim(),type:'email'});
 if(r.error){meld('Code falsch: '+r.error.message);return}
 start()};
$('abmelden').onclick=async function(){await sb.auth.signOut();location.reload()};
async function start(){
 const s=(await sb.auth.getSession()).data.session;
 if(!s){zeigeAnmeldung();return}
 $('anmeldung').hidden=true;$('innen').hidden=false;lade();ladeStart();setInterval(lade,30000)}
start();
</script></body></html>
